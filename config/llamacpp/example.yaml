# config 템플릿 — llama-server 플래그 세트.
# ─────────────────────────────────────────────────────────────
# 키 이름 규칙: llama-server 의 `--` 롱플래그를 그대로 사용.
#   예: --ctx-size 32768   →  ctx-size: 32768
#       --jinja            →  jinja: true
#       --temp 0.6         →  temp: 0.6

# 모델(GGUF)은 config 가 아니라 프로필의 hf_repo / hf_file 로 정한다.
# model / hf-repo / hf-file / models-dir 같은 모델 지정 키는 여기 쓰면 오류다.
#
# `key: false` 는 `--no-key` 로 렌더된다 (이미지에 그 플래그가 있을 때만, 없으면 오류).
#   예: jinja: false → --no-jinja.  on/off 값을 받는 플래그는 따옴표로: fit: "off"

# ═══ 자주 쓰는 플래그 ═══

# 컨텍스트 길이
ctx-size: 8192

# GPU 에 올릴 레이어 수. 99 = 전체.
n-gpu-layers: 99

# KV 캐시 정밀도: f16 / bf16 / q8_0 / q4_0 등.
cache-type-k: bf16
cache-type-v: bf16

# 샘플링 파라미터
temp: 0.7
top-p: 0.9
top-k: 40

# /v1/models 에서 보여질 이름
alias: your-model

# Jinja chat template (Qwen/Llama3 등 최신 모델 권장)
jinja: true

# ═══ MoE expert CPU offload (A3B 류 모델) ═══
# 정규식으로 tensor 이름 매칭 → 해당 tensor를 CPU 로 offload.
# 예: ffn_*_exps 만 CPU 에 두고, attention/embedding 은 GPU 유지.
# override-tensors:
#   - ".ffn_.*_exps.=CPU"

# ═══ 보안 (선택) ═══
# api-key: sk-your-key

# ═══ 성능 추가 옵션 (선택) ═══
# flash-attn: true           # flash attention 활성화 (true → "--flash-attn on")
#                            # `on`/`off`/`auto` 문자열도 사용 가능 (modern llama-server)
# parallel: 4                # 병렬 요청 슬롯
# cont-batching: true        # continuous batching
# /metrics 는 llmux 모니터링을 위해 항상 활성화됨.

# ═══ 추가 인자 (llmux 관리 옵션 제외) ═══
# llama-server 최신 플래그 중 위 스키마로 표현 못 하는 것.
extra-args: []
